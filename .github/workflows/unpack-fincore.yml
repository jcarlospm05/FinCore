name: Deploy FinCore source from ZIP

on:
  push:
    paths:
      - "FinCore_v1.2_PWA_Android.zip"
      - ".github/workflows/unpack-fincore.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack FinCore
        shell: bash
        run: |
          set -e
          rm -rf .fincore_unpack
          mkdir .fincore_unpack
          unzip -o FinCore_v1.2_PWA_Android.zip -d .fincore_unpack
          if [ -d ".fincore_unpack/FinCore_PWA_READY" ]; then
            cp -a .fincore_unpack/FinCore_PWA_READY/. .
          else
            first_dir="$(find .fincore_unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$first_dir" ]; then
              cp -a "$first_dir"/. .
            else
              cp -a .fincore_unpack/. .
            fi
          fi
          rm -rf .fincore_unpack

      - name: Commit extracted app
        shell: bash
        run: |
          git config user.name "FinCore Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy FinCore PWA v1.2"
          git push
