<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#03111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinCore" />
  <title>FinCore v1.2.2 — Tu control financiero</title>
  <link rel="icon" href="assets/fincore-logo.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest?v=1.2.2" />
  <link rel="stylesheet" href="styles.css?v=1.2.2" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-a"></div>
  <div class="bg-glow bg-glow-b"></div>

  <section id="welcomeScreen" class="welcome-screen">
    <div class="welcome-card glass-panel">
      <img src="assets/fincore-logo.png" class="welcome-logo" alt="FinCore" />
      <h1>FinCore</h1>
      <p class="welcome-subtitle">Tu control financiero</p>
      <p class="welcome-copy">Administra deudas, préstamos, pagos, ingresos, compromisos y proyecciones desde un archivo JSON privado.</p>
      <div class="welcome-actions">
        <button id="newUserBtn" class="btn btn-primary btn-lg">+ Nuevo usuario</button>
        <button id="openJsonBtn" class="btn btn-secondary btn-lg">Abrir JSON existente</button>
        <button id="installPwaBtn" class="btn btn-secondary btn-lg hidden">Instalar FinCore</button>
      </div>
      <input id="jsonFileInput" type="file" accept="application/json,.json" hidden />
      <div class="welcome-note">Sin base de datos • Sin servidor • Tus datos se mantienen en tu archivo</div>
    </div>
  </section>

  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar glass-panel">
      <div class="brand-wrap">
        <img src="assets/fincore-logo.png" class="brand-logo" alt="FinCore" />
      </div>
      <nav id="mainNav" class="nav-menu">
        <button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-view="loans">◈ <span>Préstamos</span></button>
        <button class="nav-item" data-view="payments">◎ <span>Pagos</span></button>
        <button class="nav-item" data-view="income">↗ <span>Ingresos</span></button>
        <button class="nav-item" data-view="commitments">▣ <span>Compromisos</span></button>
        <button class="nav-item" data-view="calendar">▦ <span>Calendario</span></button>
        <button class="nav-item" data-view="lenders">◉ <span>Acreedores</span></button>
        <button class="nav-item" data-view="goals">✦ <span>Objetivos</span></button>
        <button class="nav-item" data-view="forecast">▥ <span>Proyecciones</span></button>
        <button class="nav-item" data-view="reports">▤ <span>Reportes</span></button>
        <button class="nav-item" data-view="settings">⚙ <span>Configuración</span></button>
        <button id="mobileMoreBtn" class="nav-item mobile-more-btn" type="button" aria-label="Abrir menú">☰ <span>Menú</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-quote">PLANIFICA<br>CONTROLA<br>AVANZA</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar glass-panel">
        <div class="topbar-left">
          <div class="search-wrap"><span>⌕</span><input id="globalSearch" placeholder="Buscar préstamo, acreedor, pago..." /></div>
        </div>
        <div class="topbar-right">
          <button id="mobileMenuTopBtn" class="btn btn-secondary mobile-menu-top-btn" type="button">☰ Menú</button>
          <div id="saveState" class="save-state unsaved">● Cambios sin guardar</div>
          <button id="saveBtn" class="btn btn-primary">Guardar JSON</button>
          <button id="exportBtn" class="btn btn-secondary">Exportar copia</button>
          <button id="installPwaTopBtn" class="btn btn-secondary hidden">Instalar app</button>
          <button id="closeUserBtn" class="btn btn-ghost">Cerrar</button>
          <div class="user-chip"><div id="userInitials" class="avatar">FC</div><div><strong id="userNameLabel">Usuario</strong><small id="userFileLabel">Sin archivo</small></div></div>
        </div>
      </header>

      <section id="view-dashboard" class="view active-view"></section>
      <section id="view-loans" class="view"></section>
      <section id="view-payments" class="view"></section>
      <section id="view-income" class="view"></section>
      <section id="view-commitments" class="view"></section>
      <section id="view-calendar" class="view"></section>
      <section id="view-lenders" class="view"></section>
      <section id="view-goals" class="view"></section>
      <section id="view-forecast" class="view"></section>
      <section id="view-reports" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal glass-panel">
      <div class="modal-header"><h2 id="modalTitle">Formulario</h2><button id="modalClose" class="icon-btn">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/charts.js?v=1.2.2"></script>
  <script src="js/app.js?v=1.2.2"></script>
  <script src="js/pwa.js?v=1.2.2"></script>
</body>
</html>
